<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Masque le HTML français prerendu si l'utilisateur est déjà en anglais (?lang=en ou localStorage waterpulse_lang). -->
    <style>
      html[data-ssr-lang-mismatch] #root {
        visibility: hidden;
      }
    </style>
    <script>
      (function () {
        var lang = '';
        try {
          var query = new URLSearchParams(location.search).get('lang') || '';
          lang = query.toLowerCase().slice(0, 2);
          if (!lang) {
            var stored = localStorage.getItem('waterpulse_lang') || '';
            lang = stored.toLowerCase().slice(0, 2);
          }
        } catch (e) {}
        if (lang === 'en') {
          document.documentElement.setAttribute('data-ssr-lang-mismatch', '');
        }
      })();
    </script>
    <!--prerender-head-->
    <!-- Fallback SEO (dev, avant le prerender de production) — langue principale FR -->
